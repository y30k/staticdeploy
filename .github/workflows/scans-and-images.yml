name: Scans and image builds

on:
    pull_request:
    push:
        branches: [main]
    schedule:
        - cron: "23 5 * * *"

permissions:
    contents: read

jobs:
    legacy-baseline-qa:
        name: legacy-baseline-qa
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:13@sha256:4689940c683801b4ab839ab3b0a0a3555a5fe425371422310944e89eca7d8068
                env:
                    POSTGRES_PASSWORD: password
                options: >-
                    --health-cmd "pg_isready -U postgres" --health-interval 10s
                    --health-timeout 5s --health-retries 5
                ports:
                    - 5432:5432
            postgres16:
                image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
                env:
                    POSTGRES_PASSWORD: password
                options: >-
                    --health-cmd "pg_isready -U postgres" --health-interval 10s
                    --health-timeout 5s --health-retries 5
                ports:
                    - 5433:5432
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24.19.0
            - name: Start disposable MinIO
              run: |
                  docker run --detach --rm --name staticdeploy-test-minio \
                    --publish 127.0.0.1:9000:9000 \
                    --env MINIO_ROOT_USER=accessKeyId \
                    --env MINIO_ROOT_PASSWORD=secretAccessKey \
                    minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e server /data
                  for _ in {1..30}; do
                    curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live && exit 0
                    sleep 1
                  done
                  docker logs staticdeploy-test-minio
                  exit 1
            - name: Provision disposable M3 component identities
              run: scripts/setup-m304-minio-roles.sh staticdeploy-test-minio
            - name: Enable pinned Yarn
              run: |
                  corepack enable
                  test "$(yarn --version)" = "4.18.0"
            - name: Verify pre-install policy and negative cases
              run: |
                  node scripts/check-install-policy.mjs
                  node scripts/test-install-policy.mjs
            - name: Install immutable dependencies
              run: yarn install --immutable
            - name: Verify install-script inventory
              run: yarn check:install-scripts
            - name: Check formatting
              run: yarn format:check
            - name: Lint retained source
              run: yarn lint
            - name: Typecheck all workspaces without emit
              run: yarn typecheck
            - name: Compile workspaces
              run: yarn compile
            - name: Run centralized unit and integration tests with coverage
              env:
                  EXPECTED_POSTGRES_MAJOR: "13"
              run: yarn coverage
            - name: Run schema contracts on supported PostgreSQL 16
              env:
                  EXPECTED_POSTGRES_MAJOR: "16"
                  POSTGRES_TEST_URL: postgres://postgres:password@127.0.0.1:5433/postgres
              run: yarn workspace @staticdeploy/pg-s3-storages test:postgres
            - name: Run M3 object contracts on supported PostgreSQL 16
              env:
                  POSTGRES_TEST_URL: postgres://postgres:password@127.0.0.1:5433/postgres
              run: yarn workspace @staticdeploy/pg-s3-storages test:v2-objects
            - name: Run M3 job contracts on supported PostgreSQL 16
              env:
                  POSTGRES_TEST_URL: postgres://postgres:password@127.0.0.1:5433/postgres
              run: yarn workspace @staticdeploy/pg-s3-storages test:v2-jobs
            - name: Run M3 mock-IdP session contracts on supported PostgreSQL 16
              env:
                  POSTGRES_TEST_URL: postgres://postgres:password@127.0.0.1:5433/postgres
              run: yarn workspace @staticdeploy/pg-s3-storages test:v2-sessions
            - name: Run focused M3-07 authorization evidence on supported PostgreSQL 16
              env:
                  EXPECTED_POSTGRES_MAJOR: "16"
                  POSTGRES_TEST_URL: postgres://postgres:password@127.0.0.1:5433/postgres
              run: ./scripts/gates/m3-foundation.sh authorization
            - name: Run focused M3-08 projection evidence on supported PostgreSQL 16
              env:
                  EXPECTED_POSTGRES_MAJOR: "16"
                  POSTGRES_TEST_URL: postgres://postgres:password@127.0.0.1:5433/postgres
                  MINIO_TEST_URL: http://127.0.0.1:9000
                  M3_EVIDENCE_PATH: reports/m3-08-projection-evidence.json
              run: ./scripts/gates/m3-foundation.sh projection
            - name: Record exact supported-toolchain evidence
              run:
                  node scripts/write-m2-toolchain-evidence.mjs
                  reports/toolchain-evidence.json
            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: supported-toolchain-coverage
                  path: |
                      coverage/
                      management-console/coverage/
                      reports/toolchain-evidence.json
                      reports/m3-foundation-evidence.json
                      reports/m3-08-projection-evidence.json
                  if-no-files-found: error

    scans-evidence:
        name: scans-and-images-evidence
        runs-on: ubuntu-22.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
              with:
                  image: tonistiigi/binfmt:qemu-v10.2.1@sha256:d3b963f787999e6c0219a48dba02978769286ff61a5f4d26245cb6a6e5567ea3
                  platforms: arm64
            - id: buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24.19.0
            - name: Enable pinned Yarn and verify policy tooling
              run: |
                  corepack enable
                  test "$(yarn --version)" = "4.18.0"
                  node scripts/check-install-policy.mjs
                  node scripts/test-install-policy.mjs
                  yarn install --immutable
                  node scripts/test-security-policy.mjs
                  node scripts/test-sanitize-trufflehog.mjs
                  node scripts/test-multiarch-workflow.mjs
                  docker run --rm --volume "$PWD:/repo:ro" --workdir /repo \
                    rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
                  yarn check:install-scripts
            - name:
                  Build and smoke exact local amd64 and arm64 images without
                  publishing
              run: |
                  set -euo pipefail
                  mkdir -p reports
                  commit=$(git rev-parse HEAD)
                  test "$commit" = "$GITHUB_SHA"
                  docker buildx build \
                    --builder '${{ steps.buildx.outputs.name }}' \
                    --platform linux/amd64 \
                    --file staticdeploy/Dockerfile \
                    --label "org.opencontainers.image.revision=$commit" \
                    --metadata-file reports/build-amd64-metadata.raw.json \
                    --output type=oci,dest=reports/image-amd64.oci.raw.tar \
                    --load \
                    --tag staticdeploy-service:amd64 .
                  node scripts/test-image-conformance.mjs \
                    staticdeploy-service:amd64 linux/amd64 \
                    reports/image-conformance-amd64.json
                  docker buildx build \
                    --builder '${{ steps.buildx.outputs.name }}' \
                    --platform linux/arm64 \
                    --file staticdeploy/Dockerfile \
                    --label "org.opencontainers.image.revision=$commit" \
                    --metadata-file reports/build-arm64-metadata.raw.json \
                    --output type=oci,dest=reports/image-arm64.oci.raw.tar \
                    --load \
                    --tag staticdeploy-service:arm64 .
                  node scripts/test-image-conformance.mjs \
                    staticdeploy-service:arm64 linux/arm64 \
                    reports/image-conformance-arm64.json
                  node scripts/write-multiarch-image-evidence.mjs \
                    reports/multiarch-images.json \
                    linux/amd64=staticdeploy-service:amd64,reports/image-conformance-amd64.json,reports/build-amd64-metadata.raw.json,reports/image-amd64.oci.raw.tar \
                    linux/arm64=staticdeploy-service:arm64,reports/image-conformance-arm64.json,reports/build-arm64-metadata.raw.json,reports/image-arm64.oci.raw.tar
                  jq -e '
                    .registryNegative == true and
                    ([.images[].platform] | sort) == ["linux/amd64", "linux/arm64"] and
                    ([.images[].revision] | unique) == [.commit] and
                    ([.images[].configDigest] | unique | length) == 2 and
                    ([.images[].manifestDigest] | unique | length) == 2 and
                    all(.images[]; .conformance.passed and (.repoDigests | length == 0))
                  ' reports/multiarch-images.json >/dev/null
                  docker image inspect staticdeploy-service:amd64 --format '{{.Id}}' > reports-image-config-digest.txt
                  grep -Eq '^sha256:[a-f0-9]{64}$' reports-image-config-digest.txt
                  node scripts/security-policy.mjs subject reports/subject.json "$(cat reports-image-config-digest.txt)"
            - name: Scan exact tracked subject for verified or unknown secrets
              run: |
                  scan_root=$(mktemp -d)
                  raw_report=$(mktemp)
                  trap 'rm -rf "$scan_root" "$raw_report"' EXIT
                  git archive HEAD | tar -x -C "$scan_root"
                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  docker run --rm --volume "$scan_root:/subject:ro" \
                    trufflesecurity/trufflehog@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33 \
                    filesystem /subject --json --results=verified,unknown \
                    --fail --fail-on-scan-errors > "$raw_report"
                  scan_exit=$?
                  set -e
                  TRUFFLEHOG_SUBJECT_COMMIT="$(git rev-parse HEAD)" \
                    node scripts/sanitize-trufflehog.mjs "$raw_report" reports/trufflehog.raw-sanitized.json
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$scan_exit" SCANNER_COMPLETE=true \
                  SCANNER_NAME=trufflehog SCANNER_VERSION=3.97.0 \
                  SCANNER_IDENTITY='trufflesecurity/trufflehog@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33' \
                  SCANNER_RULESET_DIGEST='sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33' \
                    node scripts/security-policy.mjs record secrets reports/trufflehog.raw-sanitized.json reports/secrets.json
                  rm -rf "$scan_root" "$raw_report" reports/trufflehog.raw-sanitized.json
                  trap - EXIT
            - name: Scan exact tracked source with immutable local Semgrep rules
              run: |
                  scan_root=$(mktemp -d)
                  trap 'rm -rf "$scan_root"' EXIT
                  git archive HEAD | tar -x -C "$scan_root"
                  rules_digest="sha256:$(sha256sum config/semgrep.yml | cut -d' ' -f1)"
                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  docker run --rm --volume "$scan_root:/src:ro" --volume "$PWD/reports:/reports" \
                    returntocorp/semgrep@sha256:a265d09a9ca712e6624aca09056304ce4314a695b7028d65c041dd53fd44c700 \
                    semgrep scan --error --config /src/config/semgrep.yml \
                    --json --output /reports/semgrep.raw.json /src
                  scan_exit=$?
                  set -e
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$scan_exit" SCANNER_COMPLETE=true \
                  SCANNER_NAME=semgrep SCANNER_VERSION=1.97.0 \
                  SCANNER_IDENTITY='returntocorp/semgrep@sha256:a265d09a9ca712e6624aca09056304ce4314a695b7028d65c041dd53fd44c700' \
                  SCANNER_RULESET_DIGEST="$rules_digest" \
                    node scripts/security-policy.mjs record sast reports/semgrep.raw.json reports/sast.json
            - name: Inventory exact dependency licenses
              run: |
                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  yarn info --all --recursive --manifest --json > reports/yarn-licenses.raw.ndjson
                  license_exit=$?
                  set -e
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$license_exit" SCANNER_COMPLETE=true \
                  SCANNER_NAME=yarn-info SCANNER_VERSION=4.18.0 \
                  SCANNER_IDENTITY='yarn@npm:4.18.0' \
                  SCANNER_RULESET_DIGEST="sha256:$(sha256sum yarn.lock | cut -d' ' -f1)" \
                    node scripts/security-policy.mjs record license-inventory reports/yarn-licenses.raw.ndjson reports/license-inventory.json
            - name: Generate exact lock and image SBOMs
              run: |
                  node scripts/security-policy.mjs generate-source-sbom \
                    reports/license-inventory.json reports/source-sbom.raw.json
                  generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$generated_at" SCANNER_COMPLETED_AT="$generated_at" \
                  SCANNER_EXIT_CODE=0 SCANNER_COMPLETE=true \
                  SCANNER_NAME=staticdeploy-lock-sbom SCANNER_VERSION=1 \
                  SCANNER_IDENTITY='repository:scripts/security-policy.mjs#lock-sbom-v1' \
                  SCANNER_RULESET_DIGEST="sha256:$(sha256sum yarn.lock | cut -d' ' -f1)" \
                    node scripts/security-policy.mjs record source-sbom reports/source-sbom.raw.json reports/source-sbom.json

                  image_id=$(cat reports-image-config-digest.txt)
                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
                    --volume "$PWD/reports:/reports" \
                    anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0 \
                    "docker:$image_id" -o spdx-json=/reports/image-sbom.raw.json
                  image_exit=$?
                  set -e
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$image_exit" SCANNER_COMPLETE=true \
                  SCANNER_NAME=syft SCANNER_VERSION=1.51.0 \
                  SCANNER_IDENTITY='anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0' \
                    node scripts/security-policy.mjs record image-sbom reports/image-sbom.raw.json reports/image-sbom.json

                  arm64_image_id=$(docker image inspect staticdeploy-service:arm64 --format '{{.Id}}')
                  grep -Eq '^sha256:[a-f0-9]{64}$' <<<"$arm64_image_id"
                  docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
                    --volume "$PWD/reports:/reports" \
                    anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0 \
                    "docker:$arm64_image_id" -o spdx-json=/reports/image-sbom-arm64.raw.json
                  node scripts/compare-multiarch-image-inventory.mjs \
                    reports/multiarch-inventory.json \
                    reports/image-sbom.raw.json reports/image-sbom-arm64.raw.json \
                    "$image_id" "$arm64_image_id"
            - name: Update and validate pinned Grype database
              run: |
                  mkdir -p reports/grype-cache
                  docker run --rm --volume "$PWD/reports/grype-cache:/cache" \
                    --env GRYPE_DB_CACHE_DIR=/cache \
                    anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253 \
                    db update
                  docker run --rm --volume "$PWD/reports/grype-cache:/cache" \
                    --env GRYPE_DB_CACHE_DIR=/cache \
                    anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253 \
                    db status -o json > reports/grype-db.json
                  jq -e '.valid == true and (.built | fromdateiso8601) > 0' reports/grype-db.json >/dev/null
            - name: Scan exact source SBOM and image with pinned Grype database
              run: |
                  database_updated_at=$(jq -r .built reports/grype-db.json)
                  database_identity=$(jq -r '.schemaVersion + "|" + .from' reports/grype-db.json)
                  source_sbom_digest="sha256:$(sha256sum reports/source-sbom.raw.json | cut -d' ' -f1)"
                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  docker run --rm --volume "$PWD/reports:/reports" \
                    --env GRYPE_DB_AUTO_UPDATE=false --env GRYPE_DB_CACHE_DIR=/reports/grype-cache \
                    anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253 \
                    sbom:/reports/source-sbom.raw.json -o json > reports/grype-source.raw.json
                  source_exit=$?
                  set -e
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$source_exit" SCANNER_COMPLETE=true \
                  SCANNER_NAME=grype SCANNER_VERSION=0.117.0 \
                  SCANNER_IDENTITY='anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253' \
                  SCANNER_DATABASE_UPDATED_AT="$database_updated_at" SCANNER_DATABASE_VALID=true \
                  SCANNER_DATABASE_IDENTITY="$database_identity" SCANNER_INPUT_DIGEST="$source_sbom_digest" \
                    node scripts/security-policy.mjs record dependency-vulnerabilities reports/grype-source.raw.json reports/dependency-vulnerabilities.json

                  image_id=$(cat reports-image-config-digest.txt)
                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
                    --volume "$PWD/reports:/reports" \
                    --env GRYPE_DB_AUTO_UPDATE=false --env GRYPE_DB_CACHE_DIR=/reports/grype-cache \
                    anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253 \
                    "docker:$image_id" -o json > reports/grype-image.raw.json
                  image_exit=$?
                  set -e
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$image_exit" SCANNER_COMPLETE=true \
                  SCANNER_NAME=grype SCANNER_VERSION=0.117.0 \
                  SCANNER_IDENTITY='anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253' \
                  SCANNER_DATABASE_UPDATED_AT="$database_updated_at" SCANNER_DATABASE_VALID=true \
                  SCANNER_DATABASE_IDENTITY="$database_identity" SCANNER_INPUT_DIGEST="$image_id" \
                    node scripts/security-policy.mjs record image-vulnerabilities reports/grype-image.raw.json reports/image-vulnerabilities.json
            - name: Evaluate fail-closed vulnerability and license policy
              run: node scripts/security-policy.mjs evaluate reports
            - name: Assemble explicit sanitized evidence allowlist
              if: always()
              run: |
                  rm -rf artifact-evidence
                  mkdir -m 700 artifact-evidence
                  for report in \
                    subject.json dependency-vulnerabilities.json sast.json secrets.json \
                    image-vulnerabilities.json source-sbom.json image-sbom.json \
                    image-conformance-amd64.json image-conformance-arm64.json \
                    multiarch-images.json multiarch-inventory.json \
                    license-inventory.json normalized-findings.json \
                    vulnerability-evaluation.json normalized-license-inventory.json \
                    license-evaluation.json; do
                    if test -f "reports/$report"; then
                      install -m 600 "reports/$report" "artifact-evidence/$report"
                    fi
                  done
                  node scripts/security-policy.mjs assemble-license-evidence \
                    config/license-policy.json artifact-evidence
                  test -n "$(find artifact-evidence -maxdepth 1 -type f -print -quit)"
            - name: Remove raw scanner output
              if: always()
              run: |
                  rm -f reports/*.raw.json reports/*.raw.ndjson reports/*.raw.tar \
                    reports/grype-db.json reports-image-config-digest.txt
                  sudo rm -rf reports/grype-cache
                  find reports -type f -exec chmod 600 {} +
            - name: Upload sanitized policy evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name:
                      m2-security-policy-reports-${{ github.run_id }}-${{
                      github.run_attempt }}
                  path: artifact-evidence/
                  if-no-files-found: error
                  retention-days: 30

    m2-gate:
        name: scans-and-images
        if: always()
        needs: [legacy-baseline-qa, scans-evidence]
        runs-on: ubuntu-22.04
        timeout-minutes: 10
        steps:
            - name: Require complete prerequisite jobs
              env:
                  TOOLCHAIN_RESULT: ${{ needs['legacy-baseline-qa'].result }}
                  SCANS_RESULT: ${{ needs['scans-evidence'].result }}
              run: |
                  test "$TOOLCHAIN_RESULT" = success
                  test "$SCANS_RESULT" = success
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24.19.0
            - name: Install pinned gate policy dependency
              run: |
                  corepack enable
                  test "$(yarn --version)" = "4.18.0"
                  node scripts/check-install-policy.mjs
                  yarn install --immutable
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: supported-toolchain-coverage
                  path: gate-input/toolchain
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: m2-security-policy-reports-*
                  path: gate-input/security
                  merge-multiple: true
            - name: Close exact local M2 gate
              run: >-
                  ./scripts/gates/m2-toolchain.sh
                  gate-input/toolchain/reports/toolchain-evidence.json
                  gate-input/security reports/m2-gate-manifest.json
            - name: Upload exact M2 gate manifest
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name:
                      m2-toolchain-gate-${{ github.run_id }}-${{
                      github.run_attempt }}
                  path: reports/m2-gate-manifest.json
                  if-no-files-found: error
                  retention-days: 30
