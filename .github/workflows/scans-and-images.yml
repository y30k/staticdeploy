name: Scans and image builds

on:
    pull_request:
    push:
        branches: [main]
    schedule:
        - cron: "23 5 * * *"

permissions:
    contents: read

jobs:
    scans-and-images:
        name: scans-and-images
        runs-on: ubuntu-22.04
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24.19.0
            - name: Enable pinned Yarn
              run: |
                  corepack enable
                  test "$(yarn --version)" = "4.18.0"
            - name: Verify policy tooling and immutable install
              run: |
                  node scripts/check-install-policy.mjs
                  node scripts/test-install-policy.mjs
                  node scripts/test-security-policy.mjs
                  yarn install --immutable
                  yarn check:install-scripts
            - name: Build exact local service image without publishing
              run: |
                  docker build --file staticdeploy/Dockerfile --tag staticdeploy-service:ci .
                  docker image inspect staticdeploy-service:ci --format '{{.Id}}' > reports-image-digest.txt
                  grep -Eq '^sha256:[a-f0-9]{64}$' reports-image-digest.txt
                  mkdir -p reports
                  node scripts/security-policy.mjs subject reports/subject.json "$(cat reports-image-digest.txt)"
            - name: Scan tracked content for verified or unknown secrets
              env:
                  BASE_SHA:
                      ${{ github.event.pull_request.base.sha ||
                      github.event.before || '' }}
                  HEAD_SHA:
                      ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  mkdir -p reports
                  node scripts/test-sanitize-trufflehog.mjs
                  if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
                    BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -1)
                  fi
                  raw_report=$(mktemp)
                  trap 'rm -f "$raw_report"' EXIT
                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  docker run --rm --volume "$PWD:/repo:ro" \
                    trufflesecurity/trufflehog@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33 \
                    git file:///repo --since-commit "$BASE_SHA" --branch "$HEAD_SHA" \
                    --json --results=verified,unknown --fail --fail-on-scan-errors \
                    > "$raw_report"
                  scan_exit=$?
                  set -e
                  node scripts/sanitize-trufflehog.mjs "$raw_report" reports/trufflehog.raw-sanitized.json
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" \
                  SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$scan_exit" \
                  SCANNER_ACCEPTED_EXIT_CODES="0,183" \
                  SCANNER_COMPLETE=true \
                  SCANNER_NAME=trufflehog \
                  SCANNER_VERSION=3.97.0 \
                  SCANNER_IDENTITY='trufflesecurity/trufflehog@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33' \
                  SCANNER_RULESET_DIGEST='sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33' \
                    node scripts/security-policy.mjs record secrets reports/trufflehog.raw-sanitized.json reports/secrets.json
                  rm -f "$raw_report" reports/trufflehog.raw-sanitized.json
                  trap - EXIT
            - name: Scan exact dependency graph and inventory licenses
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  advisory=$(curl --fail --silent --show-error \
                    --header "Authorization: Bearer $GH_TOKEN" \
                    --header 'X-GitHub-Api-Version: 2022-11-28' \
                    https://api.github.com/repos/github/advisory-database/commits/main)
                  advisory_sha=$(printf '%s' "$advisory" | jq -r .sha)
                  advisory_time=$(printf '%s' "$advisory" | jq -r .commit.committer.date)
                  test -n "$advisory_sha" && test "$advisory_sha" != null
                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  yarn npm audit --all --recursive --json > reports/yarn-audit.raw.ndjson
                  audit_exit=$?
                  set -e
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" \
                  SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$audit_exit" \
                  SCANNER_ACCEPTED_EXIT_CODES="0,1" \
                  SCANNER_COMPLETE=true \
                  SCANNER_NAME=yarn-npm-audit \
                  SCANNER_VERSION=4.18.0 \
                  SCANNER_IDENTITY="github/advisory-database@$advisory_sha" \
                  SCANNER_DATABASE_UPDATED_AT="$advisory_time" \
                    node scripts/security-policy.mjs record dependency-vulnerabilities reports/yarn-audit.raw.ndjson reports/dependency-vulnerabilities.json

                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  yarn info --all --recursive --manifest --json > reports/yarn-licenses.raw.ndjson
                  license_exit=$?
                  set -e
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" \
                  SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$license_exit" \
                  SCANNER_COMPLETE=true \
                  SCANNER_NAME=yarn-info \
                  SCANNER_VERSION=4.18.0 \
                  SCANNER_IDENTITY='yarn@npm:4.18.0' \
                  SCANNER_RULESET_DIGEST="$(sha256sum yarn.lock | cut -d' ' -f1)" \
                    node scripts/security-policy.mjs record license-inventory reports/yarn-licenses.raw.ndjson reports/license-inventory.json
            - name: Scan source with immutable local Semgrep rules
              run: |
                  rules_digest="sha256:$(sha256sum config/semgrep.yml | cut -d' ' -f1)"
                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  docker run --rm --volume "$PWD:/src" \
                    returntocorp/semgrep@sha256:a265d09a9ca712e6624aca09056304ce4314a695b7028d65c041dd53fd44c700 \
                    semgrep scan --error --config /src/config/semgrep.yml \
                    --json --output /src/reports/semgrep.raw.json /src
                  scan_exit=$?
                  set -e
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" \
                  SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$scan_exit" \
                  SCANNER_ACCEPTED_EXIT_CODES="0,1" \
                  SCANNER_COMPLETE=true \
                  SCANNER_NAME=semgrep \
                  SCANNER_VERSION=1.97.0 \
                  SCANNER_IDENTITY='returntocorp/semgrep@sha256:a265d09a9ca712e6624aca09056304ce4314a695b7028d65c041dd53fd44c700' \
                  SCANNER_RULESET_DIGEST="$rules_digest" \
                    node scripts/security-policy.mjs record sast reports/semgrep.raw.json reports/sast.json
            - name: Generate exact source and image SBOMs
              run: |
                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  docker run --rm --volume "$PWD:/src:ro" --volume "$PWD/reports:/reports" \
                    anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0 \
                    dir:/src -o cyclonedx-json=/reports/source-sbom.raw.json
                  source_exit=$?
                  set -e
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$source_exit" SCANNER_COMPLETE=true \
                  SCANNER_NAME=syft SCANNER_VERSION=1.51.0 \
                  SCANNER_IDENTITY='anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0' \
                  SCANNER_RULESET_DIGEST='sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0' \
                    node scripts/security-policy.mjs record source-sbom reports/source-sbom.raw.json reports/source-sbom.json

                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
                    --volume "$PWD/reports:/reports" \
                    anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0 \
                    docker:staticdeploy-service:ci -o spdx-json=/reports/image-sbom.raw.json
                  image_exit=$?
                  set -e
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$image_exit" SCANNER_COMPLETE=true \
                  SCANNER_NAME=syft SCANNER_VERSION=1.51.0 \
                  SCANNER_IDENTITY='anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0' \
                  SCANNER_RULESET_DIGEST='sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0' \
                    node scripts/security-policy.mjs record image-sbom reports/image-sbom.raw.json reports/image-sbom.json
            - name: Scan exact image with fresh Grype database
              run: |
                  mkdir -p reports/grype-cache
                  started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  set +e
                  docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
                    --volume "$PWD/reports/grype-cache:/cache" \
                    --env GRYPE_DB_CACHE_DIR=/cache \
                    anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253 \
                    docker:staticdeploy-service:ci -o json > reports/grype.raw.json
                  scan_exit=$?
                  set -e
                  docker run --rm --volume "$PWD/reports/grype-cache:/cache" \
                    --env GRYPE_DB_CACHE_DIR=/cache \
                    anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253 \
                    db status -o json > reports/grype-db.json
                  database_updated_at=$(jq -r .built reports/grype-db.json)
                  completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  SCANNER_STARTED_AT="$started_at" SCANNER_COMPLETED_AT="$completed_at" \
                  SCANNER_EXIT_CODE="$scan_exit" SCANNER_COMPLETE=true \
                  SCANNER_NAME=grype SCANNER_VERSION=0.117.0 \
                  SCANNER_IDENTITY='anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253' \
                  SCANNER_DATABASE_UPDATED_AT="$database_updated_at" \
                    node scripts/security-policy.mjs record image-vulnerabilities reports/grype.raw.json reports/image-vulnerabilities.json
                  rm -rf reports/grype-cache
            - name: Evaluate fail-closed vulnerability and license policy
              run: node scripts/security-policy.mjs evaluate reports
            - name: Remove raw scanner output
              if: always()
              run: |
                  rm -f reports/*.raw.json reports/*.raw.ndjson reports/grype-db.json reports-image-digest.txt
                  rm -rf reports/grype-cache
                  find reports -type f -exec chmod 600 {} +
            - name: Upload sanitized policy evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name:
                      m2-security-policy-reports-${{ github.run_id }}-${{
                      github.run_attempt }}
                  path: reports/
                  if-no-files-found: error
                  retention-days: 14
